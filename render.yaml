# Blueprint de Render: crea el backend de Kairo desde este repositorio.
# En Render: New > Blueprint > elige el repo. Te pedirá RIOT_API_KEY y, opcionalmente, las keys de Supercell.
services:
  - type: web
    name: kairo-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: RIOT_API_KEY
        sync: false            # la escribes en el panel de Render; nunca se guarda en git
      - key: DEFAULT_REGION
        value: la1
      - key: RATE_LIMIT_PER_MIN
        value: "240"
      # Notificaciones: base de datos Postgres (Neon). Sin esto se usa un archivo que Render borra al reiniciar
      - key: DATABASE_URL
        sync: false
      # Supercell (opcionales: cada juego se activa al poner su key; permite la IP 45.79.218.79 al crearlas)
      - key: BRAWLSTARS_API_KEY
        sync: false
      - key: CLASHROYALE_API_KEY
        sync: false
      - key: CLASHOFCLANS_API_KEY
        sync: false
      # Dota 2, Fortnite, Apex Legends y PUBG (opcionales; Dota 2 funciona sin key)
      - key: OPENDOTA_API_KEY
        sync: false
      - key: FORTNITE_API_KEY
        sync: false
      - key: APEX_API_KEY
        sync: false
      - key: PUBG_API_KEY
        sync: false
