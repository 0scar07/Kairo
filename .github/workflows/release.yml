name: Publicar versión (APK)

# Al subir una etiqueta v* (por ejemplo v1.1.0) se construye el APK con EAS y se publica en GitHub Releases,
# de donde lo descargan el botón del README y Obtainium. Requiere el secreto EXPO_TOKEN (Settings > Secrets > Actions).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la versión (ej. v1.1.0)"
        required: true

# Por defecto el token solo lee; el trabajo que publica la versión pide escribir
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear la versión y subir el APK
    timeout-minutes: 120   # la cola gratuita de EAS puede tardar más de una hora
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Comprobar el secreto de Expo
        run: test -n "$EXPO_TOKEN" || (echo "Falta el secreto EXPO_TOKEN" && exit 1)

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el APK en EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Descargar el APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          test "$URL" != "null" && test -n "$URL"
          # Nombre fijo (Kairo.apk): así https://github.com/<repo>/releases/latest/download/Kairo.apk siempre baja la última versión
          curl -fsSL -o Kairo.apk "$URL"
          ls -lh Kairo.apk

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notas escritas a mano si existen (.github/releases/<tag>.md); si no, las genera GitHub
          NOTES=".github/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$TAG" Kairo.apk --title "Kairo ${TAG}" "${NOTES_ARGS[@]}" || \
            gh release upload "$TAG" Kairo.apk --clobber
