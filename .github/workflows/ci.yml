name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lee el repositorio: el token de GitHub del flujo no puede escribir nada
permissions:
  contents: read

jobs:
  app:
    name: App (verificación y bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Imports y tokens del tema
        run: npm run verify
      - name: El bundle de Android compila
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"

  server:
    name: Backend (sintaxis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sintaxis de todos los archivos
        run: for f in index.js lib/*.js routes/*.js; do node --check "$f"; done
      - name: Pruebas (cola hacia Riot)
        run: npm test
