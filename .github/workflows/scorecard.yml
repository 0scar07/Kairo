name: Scorecard

# Puntuación de seguridad de OpenSSF: revisa las buenas prácticas del repositorio (protección de ramas, permisos de los
# flujos, dependencias fijadas, revisión de código…), publica el resultado en la pestaña Security y alimenta la insignia
# del README. Las acciones van fijadas por commit para que nadie pueda cambiarlas por debajo.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # cada lunes
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Análisis de Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # subir el resultado a la pestaña Security
      id-token: write          # publicar el resultado para la insignia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
