<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#35E0A1" stop-opacity="0.34"/>
      <stop offset="55%"  stop-color="#35E0A1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#35E0A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7DFFCB"/>
      <stop offset="100%" stop-color="#1FC98A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Fondo: casi negro con un toque verdoso -->
  <rect id="bg" width="1024" height="1024" fill="#070C0F"/>

  <!-- Resplandor sutil detrás del símbolo -->
  <circle id="glow" cx="512" cy="512" r="470" fill="url(#glowGrad)"/>

  <!-- Símbolo: una K formada por un tallo y dos brazos; el brazo superior apunta hacia arriba (el momento justo) -->
  <g id="mark" transform="translate(-10 0)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="96">
    <g filter="url(#soft)" stroke="#35E0A1" opacity="0.55">
      <path d="M372 290 V734 M372 520 L664 290 M480 500 L668 734"/>
    </g>
    <path stroke="url(#markGrad)" d="M372 290 V734 M372 520 L664 290 M480 500 L668 734"/>
  </g>
</svg>
